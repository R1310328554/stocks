services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATA_MODE: demo
      ENABLE_SCHEDULER: "true"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./data:/data

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api